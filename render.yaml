# render.yaml — Render Blueprint for LeadForge Pro
#
# Creates a managed PostgreSQL database and a Docker web service from this
# repository. After deployment, open the service dashboard and:
#   1. Set OLLAMA_API_KEY, APP_URL, and a 64-character hexadecimal
#      MAILBOX_ENCRYPTION_KEY (sync: false makes Render prompt you).
#   2. Confirm OWNER_EMAILS includes your admin address (default below).
#   3. Add your custom domain: Dashboard → Settings → Custom Domain →
#      leads.droxaillc.com  (Render issues a free TLS certificate after DNS is configured).
#   4. Point DNS: CNAME  leads  ->  <your-service>.onrender.com
#
# Render Key Value is required for BullMQ dispatch durability. Cache operations
# can degrade, but outbound campaign execution must never use in-memory queues.

services:
  - type: web
    name: leadforge-pro
    runtime: docker
    repo: https://github.com/moonrox420/LeadForge-Pro
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONTAINERIZED
        value: "true"
      # Render is a deliberate public deployment. The local Docker Compose
      # profile keeps this true and rejects public URLs or SMTP sending.
      - key: LOCAL_ONLY_MODE
        value: "false"
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: leadforge-queue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MAILBOX_ENCRYPTION_KEY
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      - key: DELIVERY_WEBHOOK_SECRET
        generateValue: true
      - key: OWNER_EMAILS
        value: gofastkickass@gmail.com
      # Set the actual platform URL first. Change it to leads.droxaillc.com only
      # after the custom DNS record and TLS certificate are active.
      - key: APP_URL
        sync: false
      - key: SMTP_SENDING_ENABLED
        value: "false"
      # Set manually in the Render dashboard (ollama.com → Settings → Keys).
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud

  - type: keyvalue
    name: leadforge-queue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: leadforge-postgres
    plan: basic
    databaseName: leadforge_prod
    user: leadforge_app
